<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Image Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="top-bar">
            <nav aria-label="Search options">
                <a href="index.html">Google Search</a>
            </nav>
        </header>
        <main class="home-main">
            <a class="wordmark" href="index.html" aria-label="Google home">
                <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
            </a>
            <div class="page-caption">Images</div>
            <form class="search-form" action="https://www.google.com/search" method="get">
                <label class="visually-hidden" for="image-query">Search Google Images</label>
                <input type="hidden" name="tbm" value="isch">
                <input class="search-input" id="image-query" type="search" name="q" autocomplete="off">
                <div class="button-row">
                    <button class="search-button" type="submit">Google Search</button>
                </div>
            </form>
        </main>
    </body>
</html>
