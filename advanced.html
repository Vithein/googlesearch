<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="top-bar">
            <nav aria-label="Main navigation">
                <a href="index.html">Google Search</a>
                <a href="images.html">Image Search</a>
                <a href="forms.html">Form Elements</a>
            </nav>
        </header>
        <main class="advanced-main">
            <h1>Advanced Search</h1>
            <form class="advanced-form" action="https://www.google.com/search" method="get">
                <div class="advanced-field">
                    <label for="all-words">Find pages with… all these words:</label>
                    <input id="all-words" type="text" name="as_q">
                </div>
                <div class="advanced-field">
                    <label for="exact-phrase">Find pages with… this exact word or phrase:</label>
                    <input id="exact-phrase" type="text" name="as_epq">
                </div>
                <div class="advanced-field">
                    <label for="any-words">Find pages with… any of these words:</label>
                    <input id="any-words" type="text" name="as_oq">
                </div>
                <div class="advanced-field">
                    <label for="none-words">Find pages with… none of these words:</label>
                    <input id="none-words" type="text" name="as_eq">
                </div>
                <div class="advanced-submit">
                    <button class="advanced-button" type="submit">Advanced Search</button>
                </div>
            </form>
        </main>
        <footer class="site-footer">
            <nav class="footer-links" aria-label="Project links">
                <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvithein.github.io%2Fgooglesearch%2Fadvanced.html">Validate HTML</a>
                <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fvithein.github.io%2Fgooglesearch%2Fstyles.css">Validate CSS</a>
                <a href="https://github.com/Vithein/googlesearch/blob/main/citace.md">Sources and citations</a>
                <a href="https://github.com/Vithein">Portfolio</a>
            </nav>
        </footer>
    </body>
</html>
