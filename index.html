<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Google Search</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="top-bar">
            <nav aria-label="Main navigation">
                <a href="images.html">Image Search</a>
                <a href="advanced.html">Advanced Search</a>
                <a href="forms.html">Form Elements</a>
            </nav>
        </header>
        <main class="home-main">
            <a class="wordmark" href="index.html" aria-label="Google home">
                <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
            </a>
            <form class="search-form" action="https://www.google.com/search" method="get">
                <label class="visually-hidden" for="query">Search Google</label>
                <input class="search-input" id="query" type="search" name="q" autocomplete="off">
                <div class="button-row">
                    <button class="search-button" type="submit">Google Search</button>
                    <button class="search-button" type="submit" name="btnI" value="I">I'm Feeling Lucky</button>
                </div>
            </form>
        </main>
        <footer class="site-footer">
            <nav class="footer-links" aria-label="Project links">
                <a href="https://validator.w3.org/nu/?doc=https%3A%2F%2Fvithein.github.io%2Fgooglesearch%2Findex.html">Validate HTML</a>
                <a href="https://jigsaw.w3.org/css-validator/validator?uri=https%3A%2F%2Fvithein.github.io%2Fgooglesearch%2Fstyles.css">Validate CSS</a>
                <a href="https://github.com/Vithein/googlesearch/blob/main/citace.md">Sources and citations</a>
                <a href="https://github.com/Vithein">Portfolio</a>
            </nav>
        </footer>
    </body>
</html>
